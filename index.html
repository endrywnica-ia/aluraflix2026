<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <title>endryw martinsflix - Universo Streaming</title>
    
    <style>
        /* --- DESIGN SYSTEM & VARIÁVEIS --- */
        :root {
            --bg-principal: #0a0a0c;
            --bg-secundario: #121216;
            --cor-neon: #ff2a35; /* Vermelho vibrante estilo aranha / neon */
            --cor-neon-glow: rgba(255, 42, 53, 0.4);
            --cor-texto: #f5f5f7;
            --cor-texto-mutado: #a1a1aa;
            --gradiente-premium: linear-gradient(135deg, #ff2a35 0%, #9a0007 100%);
            --vidro-bg: rgba(18, 18, 22, 0.7);
            --vidro-borda: rgba(255, 255, 255, 0.08);
            --font-chakra: "Chakra Petch", sans-serif;
        }

        /* --- CONFIGURAÇÕES GERAIS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--cor-texto);
            font-family: var(--font-chakra);
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* --- TOPO / HEADER --- */
        header {endrywflix
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--vidro-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--vidro-borda);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--cor-texto);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px var(--cor-neon-glow);
        }

        .logo span {
            color: var(--cor-neon);
        }

        /* Indicador de perfil falso para simular streaming real */
        .perfil {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--cor-texto-mutado);
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--gradiente-premium);
            border: 2px solid var(--cor-texto);
            box-shadow: 0 0 10px var(--cor-neon-glow);
        }

        /* --- DESTAQUE PRINCIPAL (CHAMADA) --- */
        .chamada {
            position: relative;
            min-height: 70vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 80px 5%;
            gap: 40px;
            background: radial-gradient(circle at 20% 30%, rgba(255, 42, 53, 0.15) 0%, transparent 50%),
                        linear-gradient(180deg, rgba(10, 10, 12, 0.2) 0%, var(--bg-principal) 95%);
        }

        .chamada-texto {
            flex: 1;
            max-width: 600px;
            z-index: 2;
        }

        /* Badge estilizada */
        .badge {
            display: inline-block;
            background: var(--cor-neon-glow);
            color: var(--cor-neon);
            border: 1px solid var(--cor-neon);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--cor-neon-glow);
            animation: pulsar 2s infinite;
        }

        .chamada-texto h1 {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #e4e4e7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chamada-texto p {
            font-size: 18px;
            color: var(--cor-texto-mutado);
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* Wrapper responsivo para o vídeo principal */
        .video-container {
            flex: 1.2;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16/9;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 
                        0 0 30px rgba(255, 42, 53, 0.15);
            border: 1px solid var(--vidro-borda);
            z-index: 2;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .video-container:hover {
            transform: scale(1.02);
            border-color: var(--cor-neon);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 
                        0 0 40px rgba(255, 42, 53, 0.25);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* --- CARROSSEL DE CATEGORIAS --- */
        .categoria {
            padding: 40px 5% 80px 5%;
            background-color: var(--bg-principal);
        }

        .categoria h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Detalhe estético antes do título */
        .categoria h2::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 24px;
            background: var(--gradiente-premium);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--cor-neon);
        }

        .categoria-videos {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 5px 25px 5px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--cor-neon) var(--bg-secundario);
        }

        /* Customização da barra de rolagem */
        .categoria-videos::-webkit-scrollbar {
            height: 6px;
        }

        .categoria-videos::-webkit-scrollbar-track {
            background: var(--bg-secundario);
            border-radius: 10px;
        }

        .categoria-videos::-webkit-scrollbar-thumb {
            background: var(--cor-neon);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--cor-neon-glow);
        }

        /* Card individual do vídeo */
        .card-video {
            flex: 0 0 auto;
            width: 280px;
            aspect-ratio: 16/9;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--bg-secundario);
            border: 1px solid var(--vidro-borda);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
        }

        .card-video img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        /* Efeito hover de Cinema */
        .card-video:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: var(--cor-neon);
            box-shadow: 0 12px 30px rgba(255, 42, 53, 0.25), 
                        0 0 0 1px var(--cor-neon);
            z-index: 10;
        }

        .card-video:hover img {
            transform: scale(1.12);
            filter: brightness(0.7);
        }

        /* Overlay com ícone de play */
        .card-video::after {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 32px;
            color: #ffffff;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .card-video:hover::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* --- ANIMACÕES --- */
        @keyframes pulsar {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 42, 53, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 42, 53, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 42, 53, 0);
            }
        }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 968px) {
            .chamada {
                flex-direction: column;
                padding: 40px 5%;
                text-align: center;
                gap: 30px;
            }

            .chamada-texto {
                max-width: 100%;
            }

            .chamada-texto h1 {
                margin-top: 10px;
            }

            .video-container {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 22px;
            }

            .perfil {
                display: none; /* Simplifica o visual em telas muito pequenas */
            }

            .categoria {
                padding: 30px 20px;
            }

            .card-video {
                width: 220px;
            }
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO -->
    <header>

            <a href="https://www.youtube.com/watch?v=Ipkw_hWW-Hw" target="_blank" class="card-video" title="Assistir vídeo">

</body>
